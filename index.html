<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>どうしのれんしゅう</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="どうしのれんしゅう">

<!-- Icons -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">

<style>

  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');

  :root {
    --te: #2D9CDB;
    --nai: #EB5757;
    --jisho: #27AE60;
    --ta: #F2994A;
    --bg: #F7F9FC;
    --card: #FFFFFF;
    --text: #1A202C;
    --subtext: #718096;
    --radius: 16px;
    --shadow: 0 4px 20px rgba(0,0,0,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 32px;
  }

  /* ===== HEADER ===== */
  .header {
    background: #FFFFFF;
    color: #1A202C;
    padding: 10px 16px 10px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left h1 {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #1A202C;
    margin: 0;
  }
  .header-left p {
    font-size: 0.65rem;
    color: #718096;
    letter-spacing: 0.06em;
    margin: 0;
  }
  .header-logo {
    height: 44px;
    width: auto;
    display: block;
  }

  /* ===== FORM TABS ===== */
  .form-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 14px 12px;
    background: #FFFFFF;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .tab-btn {
    border: none;
    border-radius: 10px;
    padding: 10px 4px 8px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: #EDF2F7;
    color: #718096;
  }
  .tab-btn .tab-icon { font-size: 1.25rem; }
  .tab-btn.active-te    { background: var(--te);    color: white; box-shadow: 0 3px 10px rgba(45,156,219,0.4); }
  .tab-btn.active-nai   { background: var(--nai);   color: white; box-shadow: 0 3px 10px rgba(235,87,87,0.4); }
  .tab-btn.active-jisho { background: var(--jisho); color: white; box-shadow: 0 3px 10px rgba(39,174,96,0.4); }
  .tab-btn.active-ta    { background: var(--ta);    color: white; box-shadow: 0 3px 10px rgba(242,153,74,0.4); }

  /* ===== MAIN CONTAINER ===== */
  .container { padding: 12px 12px 0; }

  /* ===== SCORE BAR ===== */
  .score-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
    border-radius: var(--radius);
    padding: 10px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    font-size: 0.82rem;
    color: var(--subtext);
    font-weight: 700;
  }
  .score-bar .score-num {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text);
  }
  .score-bar .progress-wrap {
    flex: 1;
    margin: 0 12px;
    height: 6px;
    background: #EDF2F7;
    border-radius: 99px;
    overflow: hidden;
  }
  .score-bar .progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* ===== MODE BUTTONS ===== */
  .mode-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .mode-btn {
    flex: 1;
    border: 2px solid #E2E8F0;
    background: white;
    border-radius: 10px;
    padding: 8px 4px;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    color: #718096;
    cursor: pointer;
    transition: all 0.15s;
  }
  .mode-btn.active {
    border-color: currentColor;
  }
  .mode-btn.active.te    { color: var(--te); background: #EBF8FF; }
  .mode-btn.active.nai   { color: var(--nai); background: #FFF5F5; }
  .mode-btn.active.jisho { color: var(--jisho); background: #F0FFF4; }
  .mode-btn.active.ta    { color: var(--ta); background: #FFFAF0; }

  /* ===== QUIZ CARD ===== */
  .quiz-card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px 20px 20px;
    margin-bottom: 10px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .quiz-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  .quiz-card.te::before    { background: var(--te); }
  .quiz-card.nai::before   { background: var(--nai); }
  .quiz-card.jisho::before { background: var(--jisho); }
  .quiz-card.ta::before    { background: var(--ta); }

  .group-badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 10px;
    letter-spacing: 0.06em;
  }
  .badge-te    { background: #EBF8FF; color: var(--te); }
  .badge-nai   { background: #FFF5F5; color: var(--nai); }
  .badge-jisho { background: #F0FFF4; color: var(--jisho); }
  .badge-ta    { background: #FFFAF0; color: var(--ta); }

  .question-label {
    font-size: 0.72rem;
    color: var(--subtext);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .question-word {
    font-size: 2rem;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .question-word .ruby-wrap {
    display: inline-block;
  }
  .question-hint {
    font-size: 0.78rem;
    color: var(--subtext);
    margin-bottom: 18px;
    min-height: 1.2em;
  }

  .answer-input {
    width: 100%;
    border: 2px solid #E2E8F0;
    border-radius: 12px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 1.35rem;
    font-weight: 700;
    text-align: center;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    background: #F7F9FC;
    -webkit-appearance: none;
  }
  .answer-input:focus { border-color: #A0AEC0; background: white; }
  .answer-input.correct { border-color: #27AE60; background: #F0FFF4; color: #27AE60; }
  .answer-input.wrong   { border-color: #EB5757; background: #FFF5F5; color: #EB5757; }

  .feedback-msg {
    margin-top: 10px;
    font-size: 0.85rem;
    font-weight: 700;
    min-height: 1.4em;
    transition: opacity 0.2s;
  }
  .feedback-msg.correct { color: #27AE60; }
  .feedback-msg.wrong   { color: #EB5757; }

  /* ===== BUTTONS ===== */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 14px 8px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }
  .btn-check { color: white; }
  .btn-check.te    { background: var(--te); }
  .btn-check.nai   { background: var(--nai); }
  .btn-check.jisho { background: var(--jisho); }
  .btn-check.ta    { background: var(--ta); }
  .btn-check:active { transform: scale(0.97); }

  .btn-next {
    background: #EDF2F7;
    color: var(--subtext);
    flex: 0.6;
  }
  .btn-next:active { transform: scale(0.97); }

  /* ===== CHOICE MODE ===== */
  /* ===== FLASHCARD ===== */
  .flashcard-wrap {
    perspective: 1000px;
    margin-top: 14px;
    height: 120px;
    cursor: pointer;
  }
  .flashcard-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s ease;
  }
  .flashcard-inner.flipped { transform: rotateY(180deg); }
  .flashcard-front, .flashcard-back {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .flashcard-front {
    background: #F7F9FC;
    border: 2px dashed #CBD5E0;
    color: var(--subtext);
    font-size: 0.82rem;
    font-weight: 700;
    gap: 6px;
  }
  .flashcard-front .tap-hint { font-size: 1.4rem; }
  .flashcard-back {
    background: #F0FFF4;
    border: 2px solid #27AE60;
    transform: rotateY(180deg);
    font-size: 1.6rem;
    font-weight: 900;
    color: #27AE60;
  }
  .fc-judge-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .fc-judge-btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 13px 8px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .fc-judge-btn:active { transform: scale(0.97); }
  .fc-next   { background: #718096; color: white; }
  .fc-forgot { background: #EB5757; color: white; }

  /* ===== LIST VIEW ===== */
  .list-section {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 10px;
  }
  .list-section-header {
    padding: 10px 16px;
    font-weight: 800;
    font-size: 0.82rem;
    letter-spacing: 0.06em;
    color: white;
  }
  .list-section-header.te    { background: var(--te); }
  .list-section-header.nai   { background: var(--nai); }
  .list-section-header.jisho { background: var(--jisho); }
  .list-section-header.ta    { background: var(--ta); }

  .list-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 9px 16px;
    border-bottom: 1px solid #EDF2F7;
    font-size: 0.88rem;
    align-items: center;
  }
  .list-row:last-child { border-bottom: none; }
  .list-row:nth-child(even) { background: #F7F9FC; }
  .list-row .masu  { color: var(--subtext); font-weight: 500; }
  .list-row .form  { font-weight: 700; }

  /* ===== RESULT SCREEN ===== */
  .result-screen {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 10px;
  }
  .result-emoji { font-size: 3.5rem; margin-bottom: 8px; }
  .result-score { font-size: 2.5rem; font-weight: 900; margin-bottom: 4px; }
  .result-label { font-size: 0.85rem; color: var(--subtext); font-weight: 600; }
  .result-comment { margin: 16px 0; font-size: 0.92rem; font-weight: 600; line-height: 1.6; }
  .btn-retry {
    background: var(--text);
    color: white;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 0.04em;
  }

  ruby rt { font-size: 0.5em; }
  .special-badge {
    font-size: 0.65rem;
    font-weight: 700;
    color: #9B59B6;
    background: #F3E8FF;
    border-radius: 6px;
    padding: 2px 7px;
    vertical-align: middle;
    letter-spacing: 0.03em;
  }

</style>
</head>

// ===== RUBY MAP =====
// Simple ruby annotation lookup for display
const RUBY_MAP = {
  "書":"か","聞":"き","行":"い","急":"いそ","泳":"およ","飲":"の","読":"よ",
  "休":"やす","呼":"よ","遊":"あそ","帰":"かえ","取":"と","買":"か","会":"あ",
  "習":"なら","持":"も","待":"ま","話":"はな","消":"け","食":"た","寝":"ね",
  "教":"おし","見":"み","開":"あ","閉":"し","起":"お","借":"か","勉":"べん",
  "強":"きょう","散":"さん","歩":"ぽ","物":"もの","事":"じ","来":"き","使":"つか",
  "置":"お","脱":"ぬ","立":"た","送":"おく","知":"し","入":"い","忘":"わす",
  "止":"と","降":"お","浴":"あ","出":"だ","撮":"と","作":"つく","集":"あつ",
  "始":"はじ","弾":"ひ","泳":"およ","歌":"うた","予":"よ","約":"やく","運":"うん",
  "転":"てん","洗":"あら","捨":"す","換":"か","泊":"と","掃":"そう","除":"じ",
  "濯":"たく","心":"しん","配":"ぱい","荷":"に"
};

// 表示用の特例（来る系）
const DISPLAY_RUBY = {
  '来る':         '<ruby>来<rt>く</rt></ruby>る',
  '来ない':       '<ruby>来<rt>こ</rt></ruby>ない',
  '来て':         '<ruby>来<rt>き</rt></ruby>て',
  '来た':         '<ruby>来<rt>き</rt></ruby>た',
  '持って来る':   '<ruby>持<rt>も</rt></ruby>って<ruby>来<rt>く</rt></ruby>る',
  '持って来ない': '<ruby>持<rt>も</rt></ruby>って<ruby>来<rt>こ</rt></ruby>ない',
  '持って来て':   '<ruby>持<rt>も</rt></ruby>って<ruby>来<rt>き</rt></ruby>て',
  '持って来た':   '<ruby>持<rt>も</rt></ruby>って<ruby>来<rt>き</rt></ruby>た',
};

function addRuby(text) {
  // 特例チェック
  if (DISPLAY_RUBY[text]) return DISPLAY_RUBY[text];
  let result = '';
  for (let ch of text) {
    if (RUBY_MAP[ch]) {
      result += `<ruby>${ch}<rt>${RUBY_MAP[ch]}</rt></ruby>`;
    } else {
      result += ch;
    }
  }
  return result;
}

// ===== STATE =====
let state = {
  currentForm: 'te',
  mode: 'type',     // 'type' | 'choice' | 'list'
  questions: [],
  qIndex: 0,
  score: 0,
  answered: false,
  finished: false,
  missedQuestions: [],  // 間違えた問題を記憶
  isRetryRound: false,  // 復習ラウンド中か
};

function getAllQuestions(formKey) {
  const d = DATA[formKey];
  let qs = [];
  for (const [gname, words] of Object.entries(d.groups)) {
    for (const w of words) {
      qs.push({ ...w, group: gname, formKey });
    }
  }
  // shuffle
  return qs.sort(() => Math.random() - 0.5);
}

function getChoices(correct, formKey, count = 4) {
  const all = getAllQuestions(formKey).map(q => q.form);
  const pool = [...new Set(all)].filter(f => f !== correct);
  const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, count - 1);
  const choices = [...shuffled, correct].sort(() => Math.random() - 0.5);
  return choices;
}

// ===== RENDER =====
function render() {
  renderTabs();
  renderMain();
}

function renderTabs() {
  const tabs = document.getElementById('formTabs');
  tabs.innerHTML = '';
  for (const [key, d] of Object.entries(DATA)) {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (state.currentForm === key ? ` active-${d.color}` : '');
    btn.innerHTML = d.label;
    btn.onclick = () => {
      state.currentForm = key;
      state.questions = getAllQuestions(key);
      state.qIndex = 0; state.score = 0; state.answered = false; state.finished = false;
      state.missedQuestions = []; state.isRetryRound = false;
      render();
    };
    tabs.appendChild(btn);
  }
}

function renderMain() {
  const main = document.getElementById('mainContent');
  const d = DATA[state.currentForm];

  // Mode buttons
  let modeHtml = `<div class="mode-row">
    <button class="mode-btn ${state.mode==='type'?'active '+d.color:''}" onclick="setMode('type')">⌨️ 入力</button>
    <button class="mode-btn ${state.mode==='choice'?'active '+d.color:''}" onclick="setMode('choice')">🃏 カード</button>
    <button class="mode-btn ${state.mode==='list'?'active '+d.color:''}" onclick="setMode('list')">📋 一覧</button>
  </div>`;

  if (state.mode === 'list') {
    main.innerHTML = modeHtml + renderList();
    return;
  }

  if (state.finished) {
    main.innerHTML = modeHtml + renderResult();
    return;
  }

  const q = state.questions[state.qIndex];
  const total = state.questions.length;

  // Score bar
  const pct = Math.round((state.qIndex / total) * 100);
  const roundLabel = state.isRetryRound ? ' 🔁復習' : '';
  let scoreHtml = `<div class="score-bar">
    <span>${state.qIndex + 1}<span class="score-num"> / ${total}</span>${roundLabel}</span>
    <div class="progress-wrap">
      <div class="progress-fill" style="width:${pct}%;background:${d.colorHex}"></div>
    </div>
    <span>正解 <span class="score-num" style="color:${d.colorHex}">${state.score}</span></span>
  </div>`;

  const isSpecial = q.masu.includes('・');
  const cleanMasu = q.masu.replace('・', '');
  const displayMasu = addRuby(cleanMasu) + (isSpecial ? ' <span class="special-badge">（特別）</span>' : '');
  const groupLabel = q.group;

  let cardContent = '';
  if (state.mode === 'type') {
    cardContent = `
      <div class="question-label">ます形 → ${d.label}　に　してください</div>
      <div class="question-word">${displayMasu}</div>
      <div class="question-hint">${q.hint || '&nbsp;'}</div>
      <input class="answer-input" id="answerInput" type="text" 
        placeholder="${d.label}を　入力..." 
        autocomplete="off" autocorrect="off" spellcheck="false"
        onkeydown="if(event.key==='Enter'){checkAnswer()}" />
      <div class="feedback-msg" id="feedbackMsg">&nbsp;</div>`;
  } else {
    cardContent = `
      
      <div class="question-word">${displayMasu}</div>
      <div class="question-hint">${q.hint || '&nbsp;'}</div>
      <div class="flashcard-wrap" onclick="flipCard()" id="flashcardWrap">
        <div class="flashcard-inner" id="flashcardInner">
          <div class="flashcard-front">
            <span class="tap-hint">👆</span>
            <span>タップしてください</span>
          </div>
          <div class="flashcard-back">${addRuby(q.form)}</div>
        </div>
      </div>
      <div class="fc-judge-row" id="fcJudgeRow" style="display:none">
        <button class="fc-judge-btn fc-next"  onclick="judgeCard(true)">つぎへ →</button>
        <button class="fc-judge-btn fc-forgot" onclick="judgeCard(false)">❌ まちがえた</button>
      </div>
      <div class="feedback-msg" id="feedbackMsg">&nbsp;</div>`;
  }

  let btnHtml = '';
  if (state.mode === 'type') {
    btnHtml = `<div class="btn-row">
      <button class="btn btn-check ${d.color}" onclick="checkAnswer()">こたえる ✓</button>
      <button class="btn btn-next" onclick="nextQuestion()">スキップ →</button>
    </div>`;
  } else {
    btnHtml = '';
  }

  main.innerHTML = modeHtml + scoreHtml + `
    <div class="quiz-card ${d.color}">
      <div class="group-badge badge-${d.color}">${groupLabel}</div>
      ${cardContent}
    </div>` + btnHtml;

  if (state.mode === 'type') {
    setTimeout(() => {
      const inp = document.getElementById('answerInput');
      if (inp) inp.focus();
    }, 100);
  }
}

function renderList() {
  const d = DATA[state.currentForm];
  let html = '';
  for (const [gname, words] of Object.entries(d.groups)) {
    let rows = words.map(w =>
      `<div class="list-row">
        <span class="masu">${addRuby(w.masu)}</span>
        <span class="form" style="color:${d.colorHex}">${addRuby(w.form)}</span>
      </div>`
    ).join('');
    html += `<div class="list-section">
      <div class="list-section-header ${d.color}">${gname}</div>
      ${rows}
    </div>`;
  }
  return html;
}

function renderResult() {
  const d = DATA[state.currentForm];
  const total = state.questions.length;
  const pct = Math.round((state.score / total) * 100);
  let emoji = pct >= 90 ? '🎉' : pct >= 70 ? '😊' : pct >= 50 ? '🙂' : '💪';
  let comment = pct >= 90 ? 'すばらしい！完璧です！' : pct >= 70 ? 'よくできました！' : pct >= 50 ? 'もう少し！がんばって！' : 'もう一度　練習しましょう！';
  return `<div class="result-screen">
    <div class="result-emoji">${emoji}</div>
    <div class="result-score" style="color:${d.colorHex}">${state.score} / ${total}</div>
    <div class="result-label">正解率 ${pct}%</div>
    <div class="result-comment">${d.label}の練習 おわり！<br>${comment}</div>
    <button class="btn-retry" onclick="retry()">もう一度　チャレンジ！</button>
  </div>`;
}

// ===== ACTIONS =====
function setMode(mode) {
  state.mode = mode;
  state.questions = getAllQuestions(state.currentForm);
  state.qIndex = 0; state.score = 0; state.answered = false; state.finished = false;
  state.missedQuestions = []; state.isRetryRound = false;
  render();
}

// カタカナ→ひらがな変換
function toHiragana(str) {
  return str.replace(/[\u30A1-\u30F6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
// 漢字混じりの答えをひらがなに変換（RUBYマップ使用）
// 答え文字列ごとの特例読み（RUBY_MAPより優先）
const FORM_READING = {
  '来る':   'くる',
  '来ない': 'こない',
  '来て':   'きて',
  '来た':   'きた',
  '持って来る':   'もってくる',
  '持って来ない': 'もってこない',
  '持って来て':   'もってきて',
  '持って来た':   'もってきた',
};

function formToHiragana(str) {
  // 特例が登録されていればそのまま返す
  if (FORM_READING[str]) return FORM_READING[str];
  let result = '';
  for (let ch of str) {
    result += RUBY_MAP[ch] ? RUBY_MAP[ch] : ch;
  }
  return toHiragana(result);
}

function checkAnswer() {
  if (state.answered) { nextQuestion(); return; }
  const inp = document.getElementById('answerInput');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val) return;
  const q = state.questions[state.qIndex];
  const msg = document.getElementById('feedbackMsg');
  const correctHira = formToHiragana(q.form);
  if (val === q.form || toHiragana(val) === correctHira) {
    inp.className = 'answer-input correct';
    msg.textContent = '⭕ せいかい！';
    msg.className = 'feedback-msg correct';
    state.score++;
  } else {
    inp.className = 'answer-input wrong';
    msg.innerHTML = `❌ ざんねん…　こたえ：<b>${q.form}</b>`;
    msg.className = 'feedback-msg wrong';
  }
  state.answered = true;
  setTimeout(() => nextQuestion(), 1400);
}

function flipCard() {
  const inner = document.getElementById('flashcardInner');
  const row = document.getElementById('fcJudgeRow');
  if (!inner) return;
  inner.classList.add('flipped');
  if (row) row.style.display = 'flex';
  const wrap = document.getElementById('flashcardWrap');
  if (wrap) wrap.style.cursor = 'default';
}

function judgeCard(correct) {
  if (state.answered) return;
  state.answered = true;
  if (!correct) {
    // 間違えた問題を記憶（重複なし）
    const q = state.questions[state.qIndex];
    if (!state.missedQuestions.find(m => m.masu === q.masu && m.formKey === q.formKey)) {
      state.missedQuestions.push(q);
    }
  }
  setTimeout(() => nextQuestion(), 400);
}

function nextQuestion() {
  state.answered = false;
  state.qIndex++;
  if (state.qIndex >= state.questions.length) {
    if (state.mode === 'choice' && state.missedQuestions.length > 0 && !state.isRetryRound) {
      // 間違えた問題を復習ラウンドとして出題
      state.questions = [...state.missedQuestions].sort(() => Math.random() - 0.5);
      state.missedQuestions = [];
      state.qIndex = 0;
      state.isRetryRound = true;
    } else {
      state.finished = true;
    }
  }
  render();
}

function retry() {
  state.questions = getAllQuestions(state.currentForm);
  state.qIndex = 0; state.score = 0; state.answered = false; state.finished = false;
  state.missedQuestions = []; state.isRetryRound = false;
  render();
}

// ===== INIT =====
state.currentForm = 'te';
state.questions = getAllQuestions('te');
render();
</script>
